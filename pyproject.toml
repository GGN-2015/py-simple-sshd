[project]
name = "py-simple-sshd"
version = "0.1.9"
description = "A small, production-oriented SSH daemon implemented with Paramiko."
authors = [{ name = "GGN_2015", email = "neko@jlulug.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "paramiko>=3.4,<6.0",
    "pywinpty>=2.0,<3.0; sys_platform == 'win32' and python_version < '3.14'",
    "pywinpty>=3.0.5,<4.0; sys_platform == 'win32' and python_version >= '3.14'",
    "py-admin-launch (>=0.1.3,<0.2.0)",
]
keywords = ["ssh", "sshd", "paramiko", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
simple-sshd = "simple_sshd.cli:main"

[tool.poetry]
packages = [{ include = "simple_sshd", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
